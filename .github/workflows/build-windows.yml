name: Build TalentScreen Desktop for Windows

on:
  workflow_dispatch:        # Trigger manually from GitHub Actions tab
  push:
    tags:
      - "v*"               # Trigger automatically on version tags like v1.0.0

permissions:
  contents: write           # Needed to upload release assets

jobs:
  build-windows:
    name: Windows Installer (.msi + .exe)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies for sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r automation-sidecar/requirements-build.txt

      - name: Build sidecar executable
        run: npm run build:sidecar

      - name: Build Windows application
        run: npm run tauri build
        env:
          # Set your backend API URL here (add as a GitHub secret)
          VITE_WBL_API_URL: ${{ secrets.VITE_WBL_API_URL }}
          # Disable code signing for now (add signing secrets later if needed)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: TalentScreen-Desktop-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: TalentScreen-Desktop-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
